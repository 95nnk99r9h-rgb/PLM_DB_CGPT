<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MC Plan – Planlaufmanagement</title>
    <meta name="description" content="MC Plan – Planlaufmanagement für Projekte, Planpakete und Planverzeichnisse" />
    <meta name="theme-color" content="#f4f6f8" />
    <meta name="color-scheme" content="light" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="icon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=2" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MC Plan" />
  </head>
  <body>
    <div id="root">
      <!--
        Dieser Bereich ist nur sichtbar, solange die Anwendung nicht gestartet
        ist – React ersetzt den Inhalt von #root beim Laden.

        Wird die Seite statisch ausgeliefert (GitHub Pages mit der Quelle
        "Deploy from a branch" liefert den Quellcode statt des Builds), startet
        die Anwendung nicht. Bei einem Ladefehler wechselt die Seite zur
        gebauten Fassung im Unterverzeichnis ./app/, die als fertig gebautes Uploadpaket mitgeliefert wird. Fehlt auch diese, bleibt der Hinweis stehen.
      -->
      <div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; max-width: 40rem; margin: 12vh auto; padding: 0 1.5rem; color: #1d1d1f; line-height: 1.5;">
        <h1 style="font-size: 1.3rem; margin: 0 0 .75rem;">MC Plan wird geladen …</h1>
        <p style="margin: 0 0 1rem; color: #6e6e73;">
          Falls diese Meldung stehen bleibt, wird der Quellcode ausgeliefert und nicht die gebaute
          Anwendung. Auf GitHub Pages hilft: <strong>Settings → Pages → Build and deployment →
          Source: GitHub Actions</strong>.
        </p>
        <p style="margin: 0; color: #6e6e73;">
          Lokal wird die Anwendung mit <code style="background: #f4f6f8; padding: .1rem .35rem; border-radius: 4px;">npm run dev</code>
          gestartet oder mit <code style="background: #f4f6f8; padding: .1rem .35rem; border-radius: 4px;">npm run build</code> gebaut.
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx" onerror="if(location.hostname.endsWith('github.io') &amp;&amp; this.getAttribute('src')==='/src/main.tsx' &amp;&amp; !/\/app\/?$/.test(location.pathname)) location.replace('app/'+location.hash)"></script>
  </body>
</html>
